spring:
  application:
    name: wms-backend

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        id:
          new_generator_mappings: false

server:
  port: 8080

wms:
  sqlite:
    # 相对路径会基于 backend-java 目录解析，避免从不同工作目录启动时找不到数据库文件。
    database-file: data/wms.db
    maximum-pool-size: 5
    minimum-idle: 1

# Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
